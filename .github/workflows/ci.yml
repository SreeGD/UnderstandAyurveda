name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Content gates C1-C10. Blocking: enforces glossary coverage (Principle I),
      # source attribution (Principle III), and the medical-safety lint
      # (Principle II, NON-NEGOTIABLE).
      - name: Validate content
        run: npm run validate:content

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
